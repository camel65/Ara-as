
 

       
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invasión de Arañas Rápida</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: default;
        }

        /* Botón de Inicio Blanco */
        #btn-inicio {
            padding: 18px 45px;
            font-size: 1.6rem;
            color: #ffffff;
            background: transparent;
            border: 2px solid #ffffff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            z-index: 10;
        }

        #btn-inicio:hover {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.9);
            transform: scale(1.08);
        }

        /* Controles Flotantes */
        .controles {
            display: none;
            position: fixed;
            top: 25px;
            right: 25px;
            gap: 12px;
            z-index: 20;
        }

        .btn-control {
            padding: 10px 22px;
            font-size: 0.95rem;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-control:hover {
            background: #ffffff;
            color: #000000;
            transform: scale(1.05);
        }

        #btn-salir:hover {
            background: rgba(255, 0, 85, 0.9);
            border-color: #ff0055;
            color: #ffffff;
        }

        /* Contenedor del Lienzo */
        #canvas-container {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Audio del Proyecto (musica22.mp3) -->
    <audio id="miMusica" src="musica22.mp3" preload="auto" loop></audio>

    <!-- Botón de Inicio Blanco -->
    <button id="btn-inicio">Inicio</button>

    <!-- Controles flotantes -->
    <div class="controles" id="panel-controles">
        <button class="btn-control" id="btn-audio">🔊 Sonido: ON</button>
        <button class="btn-control" id="btn-salir">Salir</button>
    </div>

    <!-- Contenedor del lienzo -->
    <div id="canvas-container">
        <canvas id="aranasCanvas"></canvas>
    </div>

    <script>
        const btnInicio = document.getElementById('btn-inicio');
        const btnSalir = document.getElementById('btn-salir');
        const btnAudio = document.getElementById('btn-audio');
        const panelControles = document.getElementById('panel-controles');
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('aranasCanvas');
        const ctx = canvas.getContext('2d');
        const audioElement = document.getElementById('miMusica');

        let animacionId = null;
        let activo = false;

        // Estados: 'NIDO_ACTIVO', 'DISPERSION', 'ESPERA'
        let estado = 'NIDO_ACTIVO';
        let tiempoEstado = 0;

        let aranas = [];
        let raton = { x: -1000, y: -1000 };

        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', () => {
            if (activo) ajustarCanvas();
        });

        window.addEventListener('mousemove', (e) => {
            raton.x = e.clientX;
            raton.y = e.clientY;
        });

        // Clase Araña (Pequeña y Rápida)
        class Arana {
            constructor() {
                this.reiniciar();
            }

            reiniciar() {
                this.x = canvas.width / 2 + (Math.random() - 0.5) * 80;
                this.y = canvas.height / 2 + (Math.random() - 0.5) * 80;
                this.tamano = Math.random() * 3 + 4;
                this.velocidad = Math.random() * 4 + 3.5;
                this.angulo = Math.random() * Math.PI * 2;
                this.pasoPatas = 0;
            }

            actualizar(huidaGeneral) {
                this.pasoPatas += 0.45;

                if (huidaGeneral) {
                    let dx = this.x - canvas.width / 2;
                    let dy = this.y - canvas.height / 2;
                    let anguloHuida = Math.atan2(dy, dx);
                    this.x += Math.cos(anguloHuida) * 16;
                    this.y += Math.sin(anguloHuida) * 16;
                    return;
                }

                let dxRaton = this.x - raton.x;
                let dyRaton = this.y - raton.y;
                let distRaton = Math.hypot(dxRaton, dyRaton);

                if (distRaton < 140) {
                    let anguloSusto = Math.atan2(dyRaton, dxRaton);
                    this.x += Math.cos(anguloSusto) * 9;
                    this.y += Math.sin(anguloSusto) * 9;
                } else {
                    if (Math.random() < 0.12) {
                        this.angulo += (Math.random() - 0.5) * 2;
                    }
                    this.x += Math.cos(this.angulo) * this.velocidad;
                    this.y += Math.sin(this.angulo) * this.velocidad;
                }

                if (this.x < 15 || this.x > canvas.width - 15) this.angulo = Math.PI - this.angulo;
                if (this.y < 15 || this.y > canvas.height - 15) this.angulo = -this.angulo;
            }

            dibujar() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angulo + Math.PI / 2);

                ctx.strokeStyle = '#ffffff';
                ctx.fillStyle = '#ffffff';
                ctx.lineWidth = 1.2;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffffff';

                // Abdomen y Cefalotórax
                ctx.beginPath();
                ctx.arc(0, 2, this.tamano * 0.7, 0, Math.PI * 2);
                ctx.arc(0, -3, this.tamano * 0.45, 0, Math.PI * 2);
                ctx.fill();

                // 8 Patas
                for (let i = -1; i <= 1; i += 0.66) {
                    if (Math.abs(i) < 0.1) continue;

                    let osc = Math.sin(this.pasoPatas + i * 2) * 3;

                    // Patas Izquierdas
                    ctx.beginPath();
                    ctx.moveTo(-1, -1 + i * 2);
                    ctx.lineTo(-this.tamano * 1.3, -4 + i * 5 + osc);
                    ctx.lineTo(-this.tamano * 2, 2 + i * 7);
                    ctx.stroke();

                    // Patas Derechas
                    ctx.beginPath();
                    ctx.moveTo(1, -1 + i * 2);
                    ctx.lineTo(this.tamano * 1.3, -4 + i * 5 - osc);
                    ctx.lineTo(this.tamano * 2, 2 + i * 7);
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        function crearAranas() {
            aranas = [];
            for (let i = 0; i < 65; i++) {
                aranas.push(new Arana());
            }
        }

        // Telaraña Central
        function dibujarTelarana(alfa) {
            ctx.save();
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;

            ctx.strokeStyle = `rgba(255, 255, 255, ${alfa})`;
            ctx.lineWidth = 1.2;
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ffffff';

            let radios = 8;
            let anillos = 5;
            let radioMax = Math.min(canvas.width, canvas.height) * 0.35;

            for (let i = 0; i < radios; i++) {
                let a = (i / radios) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(a) * radioMax, cy + Math.sin(a) * radioMax);
                ctx.stroke();
            }

            for (let j = 1; j <= anillos; j++) {
                let r = (j / anillos) * radioMax;
                ctx.beginPath();
                for (let i = 0; i <= radios; i++) {
                    let a = (i / radios) * Math.PI * 2;
                    let x = cx + Math.cos(a) * r;
                    let y = cy + Math.sin(a) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            ctx.restore();
        }

        // Control del Botón de Audio (ON/OFF)
        btnAudio.addEventListener('click', (e) => {
            e.stopPropagation();
            audioElement.muted = !audioElement.muted;
            btnAudio.textContent = audioElement.muted ? "🔇 Sonido: OFF" : "🔊 Sonido: ON";
        });

        // Iniciar Animación
        btnInicio.addEventListener('click', () => {
            btnInicio.style.display = 'none';
            panelControles.style.display = 'flex';
            canvasContainer.style.display = 'block';

            ajustarCanvas();
            reiniciarBucle();
            activo = true;

            audioElement.currentTime = 0;
            audioElement.muted = false;
            btnAudio.textContent = "🔊 Sonido: ON";
            audioElement.play().catch(err => console.log(err));

            iniciarAnimacion();
        });

        // Salir
        btnSalir.addEventListener('click', (e) => {
            e.stopPropagation();
            activo = false;
            if (animacionId) cancelAnimationFrame(animacionId);

            audioElement.pause();
            audioElement.currentTime = 0;

            canvasContainer.style.display = 'none';
            panelControles.style.display = 'none';
            btnInicio.style.display = 'block';

            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        function reiniciarBucle() {
            estado = 'NIDO_ACTIVO';
            tiempoEstado = Date.now();
            crearAranas();
        }

        // BUCLE PRINCIPAL (Sin estela)
        function iniciarAnimacion() {
            if (!activo) return;

            // Limpieza total del fondo negro en cada fotograma para eliminar la estela
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let ahora = Date.now();

            if (estado === 'NIDO_ACTIVO') {
                dibujarTelarana(0.35);

                aranas.forEach(a => {
                    a.actualizar(false);
                    a.dibujar();
                });

                if (ahora - tiempoEstado > 10000) {
                    estado = 'DISPERSION';
                    tiempoEstado = ahora;
                }
            }
            else if (estado === 'DISPERSION') {
                let alfaRed = Math.max(0, 0.35 - (ahora - tiempoEstado) * 0.0005);
                dibujarTelarana(alfaRed);

                let fuera = 0;
                aranas.forEach(a => {
                    a.actualizar(true);
                    a.dibujar();

                    if (a.x < -40 || a.x > canvas.width + 40 || a.y < -40 || a.y > canvas.height + 40) {
                        fuera++;
                    }
                });

                if (fuera === aranas.length) {
                    estado = 'ESPERA';
                    tiempoEstado = ahora;
                }
            }
            else if (estado === 'ESPERA') {
                if (ahora - tiempoEstado > 3000) {
                    reiniciarBucle();
                }
            }

            animacionId = requestAnimationFrame(iniciarAnimacion);
        }
    </script>
</body>
</html>
